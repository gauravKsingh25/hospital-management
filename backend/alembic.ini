# Alembic configuration.
#
# The database URL is deliberately NOT set here — `alembic/env.py` reads
# DIRECT_URL (the unpooled Neon endpoint) from settings, so migrations and the
# application can never drift out of sync, and no credentials live in a
# committed file.

[alembic]
script_location = alembic
prepend_sys_path = .

# Migration filenames sort chronologically and say what they do:
#   20260801_1432-a1b2c3d4e5f6_add_hospitals_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

timezone = UTC
truncate_slug_length = 48

# Generated migrations are formatted like the rest of the codebase.
# `exec` rather than `console_scripts`: ruff ships a native binary, not a
# Python console-script entry point, so the latter cannot find it.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
